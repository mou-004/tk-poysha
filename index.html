<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="assests/logo.png" type="image/x-icon">
<!-- tailwind+daisy -->
 <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- front -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<!--icons-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZmR+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous" referrerpolicy="no-referrer" />
<!--js-->
<script src="./script/login.js"defer></script>


</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    
    <div class="logo w-[200px] mx-auto pt-32">
        <img src="assests/Logo-full.png" alt="logo" class="w-40 mx-auto mt-10">
    </div>
    <div class="text-center pt-10">
       
    <div class="card bg-base-200 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-3xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-bold">Mobile Number</label>
          <input id="input-number" maxlength="11"type="text" class="input rounded-full bg-base-200"value="01712345678" placeholder="Enter your 11 digit Number" />
          <label class="label text-neutral font-bold">4 Digit Pin</label>
          <input id="input-pass" maxlength="6" type="password" class="input rounded-full bg-base-200" placeholder="Password" />
          
          <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
        </fieldset>
      </div>
    </div>
    </div>  
  

</body>
</html>
